<!--
=====================================================================
Claude 风格消息渲染 —— 把这段集成进你的 frontend/index.html
=====================================================================
两件事:
1) 把消息正文按 Markdown 渲染(用 marked.js,5KB CDN)
2) 把 charts 数组渲成 Claude 风格的卡片(标题条 + 图 + caption)

后端发的事件:
{
  "speaker": "natural",
  "label":   "🌿 生态环境研究员",
  "content": "markdown 正文…",
  "charts":  [{"title":"...", "caption":"...", "source":"...", "data":"data:image/png;base64,..."}]
}
-->

<!-- 一、HEAD 里加 marked.js(如已有可忽略) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- 二、CSS(贴进你 <style> 里) -->
<style>
  /* 消息气泡:贴近 Claude 的留白与字号 */
  .msg-bubble {
    max-width: 760px;
    margin: 14px 0;
    padding: 14px 18px;
    border-radius: 12px;
    background: #faf9f7;
    font-size: 15px;
    line-height: 1.65;
    color: #1f1e1c;
  }
  .msg-bubble .speaker {
    font-weight: 600;
    font-size: 13px;
    color: #7a7672;
    margin-bottom: 6px;
  }
  .msg-bubble.user      { background: #ecebe8; }
  .msg-bubble.system    { background: #fff8e5; font-size: 13px; color: #7a6a3a; }
  .msg-bubble.leader    { background: #f0eef8; border-left: 3px solid #6b5fb5; }

  /* Markdown 元素的间距(Claude 那种紧凑感) */
  .msg-bubble p          { margin: 0 0 10px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
    margin: 14px 0 8px; font-weight: 600; line-height: 1.3;
  }
  .msg-bubble h2 { font-size: 17px; }
  .msg-bubble h3 { font-size: 15px; }
  .msg-bubble ul, .msg-bubble ol { padding-left: 22px; margin: 6px 0 10px; }
  .msg-bubble li { margin: 3px 0; }
  .msg-bubble code {
    background: #efeeea; padding: 1px 6px; border-radius: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
  }
  .msg-bubble pre code { display:block; padding:10px 12px; overflow-x:auto; }
  .msg-bubble table { border-collapse: collapse; margin: 10px 0; font-size: 14px; }
  .msg-bubble th, .msg-bubble td { border: 1px solid #d8d6d1; padding: 6px 10px; }
  .msg-bubble th { background: #efeeea; font-weight: 600; }
  .msg-bubble blockquote {
    border-left: 3px solid #d4d2cd; padding-left: 12px;
    color: #555; margin: 8px 0;
  }

  /* ★ 图表卡片 —— 模仿 Claude artifact 卡片样式 */
  .chart-card {
    margin: 14px 0 6px;
    border: 1px solid #e3e1dc;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .chart-card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: #f5f4f0;
    border-bottom: 1px solid #e3e1dc;
    font-size: 13px;
  }
  .chart-card-title { font-weight: 600; color: #2a2926; }
  .chart-card-source { color: #7a7672; font-size: 12px; }
  .chart-card-img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  .chart-card-caption {
    padding: 8px 14px 12px;
    font-size: 12.5px;
    color: #6b6864;
    line-height: 1.55;
    border-top: 1px solid #f0eee9;
  }
  .chart-card-caption:empty { display: none; }

  /* 点图放大 */
  .img-lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; cursor: zoom-out;
  }
  .img-lightbox img { max-width: 92%; max-height: 92%; }
</style>


<!-- 三、JS:消息渲染函数(放到你脚本里) -->
<script>
  // Markdown → 安全 HTML。研究员/Leader 的正文都过这条。
  function renderMarkdown(text) {
    if (!text) return '';
    // marked 自带基础 XSS 防护;如果担心可再叠一层 DOMPurify
    return marked.parse(text, { breaks: true, gfm: true });
  }

  // 渲染一张图表卡片 —— Claude artifact 风格
  function renderChart(chart) {
    const card = document.createElement('div');
    card.className = 'chart-card';

    const header = document.createElement('div');
    header.className = 'chart-card-header';
    const t = document.createElement('span');
    t.className = 'chart-card-title';
    t.textContent = chart.title || '图表';
    const s = document.createElement('span');
    s.className = 'chart-card-source';
    s.textContent = chart.source || '';
    header.appendChild(t); header.appendChild(s);

    const img = document.createElement('img');
    img.className = 'chart-card-img';
    img.src = chart.data;                 // data:image/png;base64,...
    img.alt = chart.title || '';
    img.addEventListener('click', () => openLightbox(chart.data));

    const cap = document.createElement('div');
    cap.className = 'chart-card-caption';
    cap.textContent = chart.caption || '';

    card.appendChild(header);
    card.appendChild(img);
    card.appendChild(cap);
    return card;
  }

  function openLightbox(src) {
    const box = document.createElement('div');
    box.className = 'img-lightbox';
    const big = document.createElement('img');
    big.src = src;
    box.appendChild(big);
    box.addEventListener('click', () => box.remove());
    document.body.appendChild(box);
  }

  // 渲染一条完整消息(替换你原来 append 消息的函数)
  function appendMessage(container, evt) {
    const bubble = document.createElement('div');
    let cls = 'msg-bubble';
    if (evt.speaker === 'user')   cls += ' user';
    if (evt.speaker === 'System') cls += ' system';
    if (evt.speaker === 'Leader') cls += ' leader';
    bubble.className = cls;

    // 说话人
    if (evt.label) {
      const sp = document.createElement('div');
      sp.className = 'speaker';
      sp.textContent = evt.label;
      bubble.appendChild(sp);
    }

    // 正文(Markdown 渲染)
    if (evt.content) {
      const body = document.createElement('div');
      body.innerHTML = renderMarkdown(evt.content);
      bubble.appendChild(body);
    }

    // 图表卡片(在正文之后,Claude 也是这个顺序)
    if (Array.isArray(evt.charts)) {
      evt.charts.forEach(c => bubble.appendChild(renderChart(c)));
    }

    container.appendChild(bubble);
    container.scrollTop = container.scrollHeight;
  }
</script>
